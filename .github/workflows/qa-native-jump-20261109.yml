name: QA native Windows jump A-B

on:
  push:
    branches:
      - 'palmoni5/qa-pdfrx798-candidate-20261109'
      - 'palmoni5/qa-pdfrx798-baseline-20261109'

jobs:
  native-pdfium-jump:
    name: Windows native PDFium top-anchor benchmark
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve pinned workspace packages
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Setup Python for deterministic scanned PDF fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 40-page scanned PDF fixture
        working-directory: packages/pdfrx
        run: python ../../tool/qa/generate_scanned_pdf.py test/assets/qa_scanned40.pdf

      - name: Benchmark real PDFium page jumps (same test on both revisions)
        working-directory: packages/pdfrx
        run: flutter test test/qa_jump_benchmark_test.dart --dart-define=PDFRX_JUMP_BENCH=true --reporter expanded

      - name: Generate scanned PDF asset for native profile app
        working-directory: packages/pdfrx
        run: python ../../tool/qa/generate_scanned_pdf.py example/viewer/assets/qa_scanned40.pdf

      - name: Measure native Windows profile jumps and process RSS
        working-directory: packages/pdfrx/example/viewer
        run: flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/qa_native_jump_profile_test.dart --dart-define=PDFRX_JUMP_BENCH=true
